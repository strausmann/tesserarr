# Prose checks (Vale v3.26.0). Levels: error fails the Prose job; warning and
# suggestion are only reported in the job summary.
# Run: scripts/vale_setup.sh (once), then .vale/bin/vale $(scripts/vale_scope.sh)
# Spelling is off: a dictionary for product names and terms would turn the check
# red without a defect.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = Vale, Tesserarr
Vale.Spelling = NO
Vale.Terms = NO
# The maintainer's name is a name, not German prose (CLA.md, licence headers).
TokenIgnores = (Björn Strausmann)
