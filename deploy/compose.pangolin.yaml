services:
  tesserarr:
    image: ghcr.io/example/tesserarr:0.0.1
    restart: unless-stopped
    environment:
      TESSERARR_BASE_URL: "https://tesserarr.example.org"
      TESSERARR_DATA_DIR: "/data"
      TESSERARR_SESSION_SECRET: "CHANGE_ME"
      TESSERARR_TRUSTED_PROXIES: "172.20.0.0/16"
      TESSERARR_SYNCTHING_API_URL: "http://syncthing:8384"
      TESSERARR_SYNCTHING_API_KEY: "CHANGE_ME"
    volumes:
      - ./data:/data
      - /mnt/media/outgoing:/data/outgoing
      - /mnt/media/income:/data/income
    healthcheck:
      test: ["CMD", "/usr/local/bin/tesserarr", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    labels:
      - "pangolin.public-resources.tesserarr.name=Tesserarr"
      - "pangolin.public-resources.tesserarr.full-domain=tesserarr.example.org"
      - "pangolin.public-resources.tesserarr.protocol=http"
      - "pangolin.public-resources.tesserarr.ssl=true"
      - "pangolin.public-resources.tesserarr.targets[0].method=http"
      - "pangolin.public-resources.tesserarr.targets[0].port=8080"
      - "pangolin.public-resources.tesserarr.targets[0].path-match=prefix"
      # Kein auth.sso-enabled — die Oberfläche bringt die eigene Anmeldung mit
      # (ADR-0007), ein zweites Login davor wäre doppelt. Die tokengeprüften
      # Pfade (Newznab-/SABnzbd-Nachbildung) brauchen ohnehin einen Bypass um
      # jede vorgelagerte Anmeldung, siehe „Öffentlicher Betrieb".
