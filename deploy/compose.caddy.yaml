services:
  tesserarr:
    image: ghcr.io/strausmann/tesserarr:0.0.1
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TESSERARR_BASE_URL: "https://tesserarr.example.org"
      TESSERARR_DATA_DIR: "/data"
      TESSERARR_SESSION_SECRET: "CHANGE_ME"
      # Genau ein vertrauenswürdiger Hop: der Caddy-Dienst im selben Compose-Netz.
      TESSERARR_TRUSTED_PROXIES: "172.20.0.0/16"
      TESSERARR_SYNCTHING_API_URL: "http://syncthing:8384"
      TESSERARR_SYNCTHING_API_KEY: "CHANGE_ME"
    volumes:
      - ./data:/data
      - /mnt/media/outgoing:/data/outgoing
      - /mnt/media/income:/data/income
    healthcheck:
      test: ["CMD", "/usr/local/bin/tesserarr", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # TLS certificates live here; a bind mount keeps them inside the stack
      # directory so a backup of that directory actually contains them.
      - ./caddy-data:/data
