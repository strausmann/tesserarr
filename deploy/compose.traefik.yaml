services:
  tesserarr:
    image: ghcr.io/example/tesserarr:0.0.1
    restart: unless-stopped
    environment:
      TESSERARR_BASE_URL: "https://tesserarr.example.org"
      TESSERARR_DATA_DIR: "/data"
      TESSERARR_SESSION_SECRET: "CHANGE_ME"
      TESSERARR_TRUSTED_PROXIES: "172.20.0.0/16"
      TESSERARR_SYNCTHING_API_URL: "http://syncthing:8384"
      TESSERARR_SYNCTHING_API_KEY: "CHANGE_ME"
    volumes:
      - ./data:/data
      - /mnt/media/outgoing:/data/outgoing
      - /mnt/media/income:/data/income
    healthcheck:
      test: ["CMD", "/usr/local/bin/tesserarr", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tesserarr.rule=Host(`tesserarr.example.org`)"
      - "traefik.http.routers.tesserarr.entrypoints=websecure"
      - "traefik.http.routers.tesserarr.tls=true"
      - "traefik.http.services.tesserarr.loadbalancer.server.port=8080"

networks:
  traefik-public:
    external: true
