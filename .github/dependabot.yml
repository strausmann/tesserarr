# Version updates come from Renovate (renovate.json, .github/workflows/renovate.yml).
# Dependabot opens no version update: open-pull-requests-limit is 0 for every
# ecosystem. Dependabot alerts stay on (a repository setting, not this file).
# The entries stay so that a Dependabot security update, if the repository
# setting "Dependabot security updates" is ever turned on again, still gets a
# commit message commitlint accepts. Dependabot reads this file only from main.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 0
    labels: [dependencies, php]
    commit-message:
      prefix: chore
      include: scope
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]
        applies-to: version-updates

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 0
    labels: [dependencies, javascript]
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
        applies-to: version-updates

  # The pinned semantic-release toolchain of release.yml (not shipped in the image).
  - package-ecosystem: npm
    directory: /.github/release-tools
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 0
    labels: [dependencies, javascript]
    commit-message:
      prefix: ci
      include: scope
    groups:
      release-tools:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 0
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 0
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-all:
        patterns: ['*']
