name: Dependabot auto-merge

# Patch and minor Dependabot updates are approved and squash-merged once CI
# (including the licence gate) is green. Major updates are never merged
# automatically. Manifests and lockfiles have no code owner for this reason
# (.github/CODEOWNERS); workflow and Dockerfile updates stay owned.
#
# Trust is decided per run, on the head commit the event names:
# - the event actor is dependabot[bot], and
# - every commit of the pull request has the GitHub author dependabot[bot], the
#   committer web-flow and a verified signature (that is how a Dependabot commit
#   looks, checked on Dependabot pull requests in Labelyard), and
# - the last commit of the list is the head commit of the event.
# If any of this fails, for example because someone else pushed onto the
# Dependabot branch (the pull request author stays dependabot[bot]), the job
# revokes what an earlier run granted: auto-merge is disabled and this
# workflow's approvals are dismissed. The approval itself is given only while
# the head is still the checked commit, and the merge is bound to it.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge patch and minor Dependabot updates
    runs-on: ubuntu-24.04
    # Only the pull request author here: a push by someone else (synchronize)
    # must still reach the revoke step below.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ACTOR: ${{ github.actor }}
    steps:
      - name: Trust the commits
        id: trust
        run: |
          set -euo pipefail
          reason=""
          if [ "$ACTOR" != 'dependabot[bot]' ]; then
            reason="the event actor is $ACTOR, not dependabot[bot]"
          else
            # One line per commit, in order: sha, then "ok" or what is wrong with it.
            report="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/commits" --jq '.[] |
              .sha + " " + (if (.author.login // "") == "dependabot[bot]"
                              and (.committer.login // "") == "web-flow"
                              and (.commit.verification.verified == true)
                            then "ok"
                            else "author=" + (.author.login // "none") + " committer=" + (.committer.login // "none")
                                 + " verified=" + ((.commit.verification.verified // false) | tostring)
                            end)')"
            bad="$(printf '%s\n' "$report" | grep -v ' ok$' || [ $? -eq 1 ])"
            last="$(printf '%s\n' "$report" | tail -n 1 | cut -d' ' -f1)"
            if [ -z "$report" ]; then
              reason="the pull request has no commits"
            elif [ -n "$bad" ]; then
              reason="commits that are not Dependabot's: $(printf '%s' "$bad" | tr '\n' ';')"
            elif [ "$last" != "$HEAD_SHA" ]; then
              reason="the head moved from $HEAD_SHA to $last while checking"
            fi
          fi
          if [ -n "$reason" ]; then
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            printf 'Not trusted: %s\n' "$reason"
            printf '### Not auto-merged\n\nPull request #%s: %s\n' "$PR_NUMBER" "$reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs when the check said no and when it failed (API error): fail closed.
      - name: Revoke auto-merge and approvals
        if: always() && steps.trust.outputs.trusted != 'true'
        run: |
          set -euo pipefail
          # Disable auto-merge only when it is on; `gh pr merge --disable-auto`
          # fails on a pull request without it, and that case is not an error here.
          enabled="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$enabled" = true ]; then
            gh pr merge --disable-auto "$PR_URL"
            echo "- auto-merge disabled" >> "$GITHUB_STEP_SUMMARY"
          fi
          ids="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id')"
          for id in $ids; do
            gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews/$id/dismissals" \
              -f message="Revoked: the pull request has commits that are not verified Dependabot commits." \
              -f event=DISMISS > /dev/null
            echo "- approval $id dismissed" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- review and merge this pull request by hand" >> "$GITHUB_STEP_SUMMARY"

      - name: Get Dependabot metadata
        id: meta
        if: steps.trust.outputs.trusted == 'true'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI
        if: steps.trust.outputs.trusted == 'true'
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          running-workflow-name: 'Auto-merge patch and minor Dependabot updates'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          allowed-conclusions: success,skipped

      - name: Approve and enable auto-merge for patch and minor updates
        if: steps.trust.outputs.trusted == 'true' && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$current" != "$HEAD_SHA" ]; then
            printf '### Not auto-merged\n\nThe head moved from %s to %s after the check; the run for the new head decides.\n' \
              "$HEAD_SHA" "$current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"

      - name: Comment on major updates
        if: steps.trust.outputs.trusted == 'true' && steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: gh pr comment "$PR_URL" --body "This is a major version update of \`$DEPENDENCY_NAMES\`. It is not merged automatically; read the changelog and merge by hand."
