name: Dependabot auto-merge

# Patch and minor Dependabot updates are approved and squash-merged once CI
# (including the licence gate) is green. Major updates are never merged
# automatically. Manifests and lockfiles have no code owner for this reason
# (.github/CODEOWNERS); workflow and Dockerfile updates stay owned.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge patch and minor Dependabot updates
    runs-on: ubuntu-24.04
    # Both the actor of this event and the author of the pull request must be
    # Dependabot; the next step also checks every commit of the pull request.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Get Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A maintainer with write access can push a commit onto a Dependabot branch;
      # the pull request author stays dependabot[bot]. Such a pull request is
      # neither approved nor merged here. All pages of the commit list are read.
      - name: Every commit is from Dependabot
        id: commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          authors="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/commits" --jq '.[] | (.author.login // "(no GitHub account)")' | sort -u)"
          if [ "$authors" = 'dependabot[bot]' ]; then
            echo "only-dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "only-dependabot=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Not auto-merged"
              echo
              echo "Pull request #$PR_NUMBER has commits by other authors; review and merge it by hand:"
              echo
              printf '%s\n' "$authors" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Wait for CI
        if: steps.commits.outputs.only-dependabot == 'true'
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          running-workflow-name: 'Auto-merge patch and minor Dependabot updates'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          allowed-conclusions: success,skipped

      - name: Approve patch and minor updates
        if: steps.commits.outputs.only-dependabot == 'true' && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: steps.commits.outputs.only-dependabot == 'true' && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major updates
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: gh pr comment "$PR_URL" --body "This is a major version update of \`$DEPENDENCY_NAMES\`. It is not merged automatically; read the changelog and merge by hand."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
