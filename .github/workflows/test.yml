name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test ./... -race -coverprofile=coverage.out

      - name: Coverage gate
        run: |
          ./scripts/coverage-gate-strict.sh coverage.out \
            internal/config:60 \
            internal/store:85 \
            internal/api:80 \
            internal/selftest:80

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
