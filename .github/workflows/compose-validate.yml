name: compose-validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate every compose template
        run: |
          failed=0
          for f in deploy/compose*.yaml; do
            echo "=== $f ==="
            if ! docker compose -f "$f" config --quiet; then
              failed=1
            fi
          done
          exit "$failed"
