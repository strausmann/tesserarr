# Build a preview image of a milestone before its release, e.g. 0.1.0-rc.3.
#
# Run it by hand on the milestone branch that holds the work (or on main); any
# other branch is refused, because only these refs are signed.
# Version is x.y.z or, for a patch milestone, x.y.x (next free patch).
# The rc number counts up from the tags already in GHCR
# (ghcr.io/strausmann/tesserarr); the same tag goes to GHCR and Docker Hub
# (docker.io/bstrausmann/tesserarr). A preview gets only its exact
# tag: no `latest`, no x.y / x (docker-publish.yml treats every version with a
# `-` as a pre-release). registry-cleanup.yml keeps previews on both registries
# while their release does not exist and removes them afterwards.

name: Preview image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Milestone version the preview leads to: 0.1.0, or 0.1.x for the next free patch"
        type: string
        required: true

permissions: {}

concurrency:
  # Shared with registry-cleanup.yml (see there).
  group: ghcr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  next-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      # Previews are published to both registries, so they are signed like the
      # release images. docker-publish.yml signs only on main and
      # milestone/x.y.0 or milestone/x.y.x; a preview from any other branch
      # would go out unsigned, so it is refused here, before anything is built.
      - name: Refuse a branch whose images are not signed
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          signed_refs='^refs/(heads/main|heads/milestone/[0-9]+\.[0-9]+\.(0|x))$'
          if ! [[ "$REF" =~ $signed_refs ]]; then
            echo "::error::A preview is built from main or a milestone branch only (the images of other branches are not signed)"
            exit 1
          fi

      - name: Compute the next rc tag
        id: next
        env:
          VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PATH: strausmann/tesserarr
        run: |
          set -euo pipefail
          # 0.1.x -> 0.1.<next free patch>-rc.N; 0.2.0 -> 0.2.0-rc.N; a released
          # version is refused. A package that does not exist yet (first preview
          # of a new image) has an empty tag list: 403/404 is tolerated there.
          python3 scripts/ghcr_rules.py fetch-tags > tags.txt
          tag=$(python3 scripts/ghcr_rules.py next-preview "$VERSION" < tags.txt)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preview tag: $tag" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: next-tag
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.next-tag.outputs.tag }}
      ref: ${{ github.sha }}
    # By name, as release.yml does: no `inherit`, and never the admin token.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      packages: write
      id-token: write
