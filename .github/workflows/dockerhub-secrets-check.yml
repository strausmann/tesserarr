# Temporary check of the Docker Hub secrets. Never merged.
name: Docker Hub secrets check
on:
  pull_request:
    paths: [.github/workflows/dockerhub-secrets-check.yml]
permissions: {}
jobs:
  check:
    name: Docker Hub secrets check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      REPO: bstrausmann/tesserarr
    steps:
      - name: Push token (organization token) signs in
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          code=$(jq -n --arg i "$U" --arg s "$T" '{identifier:$i,secret:$s}' | curl -sS -o /tmp/r.json -w '%{http_code}' -H 'Content-Type: application/json' --data @- https://hub.docker.com/v2/auth/token)
          echo "push token sign-in: HTTP $code"
          test "$code" = 200
          echo "$U" | docker login -u "$U" --password-stdin <<< "$T" >/dev/null 2>&1 && echo "docker login with push token: ok" || { echo "docker login with push token: FAILED"; exit 1; }
      - name: Admin token (personal) signs in, reads and edits the repository
        env:
          U: ${{ secrets.DOCKERHUB_ADMIN_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN_ADMIN }}
        run: |
          code=$(jq -n --arg i "$U" --arg s "$T" '{identifier:$i,secret:$s}' | curl -sS -o /tmp/a.json -w '%{http_code}' -H 'Content-Type: application/json' --data @- https://hub.docker.com/v2/auth/token)
          echo "admin token sign-in: HTTP $code"; test "$code" = 200
          AT=$(jq -r .access_token /tmp/a.json); echo "::add-mask::$AT"; rm -f /tmp/a.json
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$AT" | curl -sS -K - -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/$REPO/")
          echo "read repository: HTTP $code"; test "$code" = 200
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$AT" | curl -sS -K - -o /dev/null -w '%{http_code}' -X PATCH -H 'Content-Type: application/json' --data '{"description":"Share parts of your media library with friends over Syncthing."}' "https://hub.docker.com/v2/repositories/$REPO/")
          echo "edit repository description: HTTP $code"; test "$code" = 200
