name: publish-image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Check out the release tag, not the branch head: the image must carry the
      # revision that was released, not whatever landed on main afterwards.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version tags
        id: tags
        run: |
          full="${GITHUB_REF_NAME#v}"
          major="${full%%.*}"
          rest="${full#*.}"
          minor="${major}.${rest%%.*}"
          {
            echo "full=$full"
            echo "major=$major"
            echo "minor=$minor"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.tags.outputs.full }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.release.published_at }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.major }}
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.minor }}
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.full }}
