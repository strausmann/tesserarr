name: Commitlint

# The pull request title becomes the squash commit, which semantic-release reads.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install commitlint
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/commitlint" @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4

      # The config is copied next to the installed packages, so its `extends`
      # resolves there and nothing is installed into the project.
      - name: Validate the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          cp commitlint.config.cjs "$RUNNER_TEMP/commitlint/"
          printf '%s\n' "$PR_TITLE" | "$RUNNER_TEMP/commitlint/node_modules/.bin/commitlint" --config "$RUNNER_TEMP/commitlint/commitlint.config.cjs"
