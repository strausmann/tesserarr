; Tesserarr overrides on top of php.ini-production.

; No function arguments in stack traces (they can carry addresses and tokens).
zend.exception_ignore_args = On
display_errors = Off
display_startup_errors = Off
expose_php = Off

; The image is immutable: no need to stat files on every request.
opcache.enable = 1
opcache.validate_timestamps = 0

; Caddy caps request bodies at 2 MiB already.
post_max_size = 3M
upload_max_filesize = 2M
