# Local development stack: PostgreSQL plus the central instance as web,
# worker and scheduler, all from the same image.
#
#   cp .env.example .env
#   docker compose --env-file docker/base-images.env -f compose.dev.yaml run --rm --no-deps web artisan key:generate --show
#   (put the key into .env as APP_KEY)
#   echo "base64:$(openssl rand -base64 32)"   (twice: TESSERARR_PII_KEY and TESSERARR_BLIND_INDEX_KEY in .env)
#   docker compose --env-file docker/base-images.env -f compose.dev.yaml up --build
#
# --env-file docker/base-images.env supplies the base image pins the build
# needs (docker/Dockerfile has no default for them, see CONTRIBUTING.md).
#
# The one-off "migrate" service backs up the database and creates the schema
# first; web, worker and scheduler start only after it exited successfully.
#
# Data lives in bind mounts below .dev/ (git-ignored), never in named volumes.

# Built once by the web service; the other services reuse the image.
x-app: &app
    image: tesserarr:dev
    pull_policy: never
    env_file:
        - path: .env
          required: false
    environment:
        TESSERARR_ROLE: central
        DB_CONNECTION: pgsql
        DB_HOST: postgres
        DB_PORT: '5432'
        DB_DATABASE: tesserarr
        DB_USERNAME: tesserarr
        DB_PASSWORD: tesserarr
    volumes:
        - /etc/localtime:/etc/localtime:ro
    depends_on:
        postgres:
            condition: service_healthy
        migrate:
            condition: service_completed_successfully

services:
    postgres:
        image: postgres:18.7-trixie@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
        pull_policy: missing
        environment:
            POSTGRES_DB: tesserarr
            POSTGRES_USER: tesserarr
            POSTGRES_PASSWORD: tesserarr
        volumes:
            # PostgreSQL 18 keeps its data in /var/lib/postgresql/18/docker; the
            # mount is the parent directory (see the postgres image docs, PGDATA).
            - ./.dev/postgresql:/var/lib/postgresql
            - /etc/localtime:/etc/localtime:ro
        healthcheck:
            test: ['CMD', 'pg_isready', '-U', 'tesserarr', '-d', 'tesserarr']
            interval: 5s
            timeout: 3s
            retries: 20

    # Creates the schema before web, worker and scheduler start. Central role
    # only: a satellite has no database and never migrates. tesserarr:migrate
    # writes a pg_dump backup to .dev/backups/ first when something is pending
    # (the image runs as UID 10001: chown the directory, see CONTRIBUTING.md).
    migrate:
        <<: *app
        command: ['artisan', 'tesserarr:migrate']
        restart: 'no'
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - ./.dev/backups:/var/lib/tesserarr/backups
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            disable: true

    web:
        <<: *app
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: runtime
            args:
                FRANKENPHP_IMAGE: ${FRANKENPHP_IMAGE}
                COMPOSER_IMAGE: ${COMPOSER_IMAGE}
                NODE_IMAGE: ${NODE_IMAGE}
        pull_policy: build
        command: ['web']
        ports:
            - '127.0.0.1:8080:8080'

    worker:
        <<: *app
        command: ['worker']
        healthcheck:
            disable: true

    scheduler:
        <<: *app
        command: ['scheduler']
        healthcheck:
            disable: true
