# SPDX-FileCopyrightText: 2026 Björn Strausmann and Tesserarr contributors
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Licensing of the files that cannot or must not carry an inline SPDX header
# (https://reuse.software/spec-3.3/). Every own file whose format allows a
# comment carries the header inline instead (CONTRIBUTING.md, "Licence headers").
# Paths are listed one by one, not with wide globs, so a new file without a
# header fails `reuse lint` instead of being covered silently. Each block says
# why its files are here. Paths that do not exist (yet) on a branch are ignored.
# Third-party blocks use precedence = "override" so an own glob can never
# relicense them.

version = 1

# Data formats without comment syntax: Composer and npm manifests and lockfiles,
# licence-policy.yml, which the licence gate parses as JSON, renovate.json and
# tsconfig.node.json (REUSE reads no comments in a .json file).
[[annotations]]
path = ["composer.json", "composer.lock", "package.json", "package-lock.json", "licence-policy.yml", "renovate.json", "tsconfig.node.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Björn Strausmann and Tesserarr contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The release toolchain: .releaserc.json and the pinned semantic-release
# manifest and lockfile in .github/release-tools/ (JSON, no comment syntax).
[[annotations]]
path = [".releaserc.json", ".github/release-tools/package.json", ".github/release-tools/package-lock.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Björn Strausmann and Tesserarr contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The ASCII-armoured public key of the security contact (SECURITY.md).
[[annotations]]
path = ".well-known/security.asc"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Björn Strausmann and Tesserarr contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

